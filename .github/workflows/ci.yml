name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: python3 scripts/check_architecture_boundaries.py
      - run: npm test
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two merges in a row must not deploy (or migrate) at the same time; the second waits for the first.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Cloudflare secrets
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set. Add it in Repository Settings -> Secrets and variables -> Actions."
              exit 1
            fi
          done
          echo "::add-mask::$D1_DATABASE_ID"
          if ! printf '%s' "$D1_DATABASE_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::D1_DATABASE_ID is not a UUID."
            exit 1
          fi
      # The tracked wrangler.jsonc keeps a placeholder database_id and is never edited. The real id lives only in the
      # D1_DATABASE_ID secret and goes into a generated, git-ignored config that the next two steps pass with --config.
      - name: Generate the production wrangler config
        run: |
          jq -e '[.d1_databases[] | select(.binding == "DB" and .database_id == "00000000-0000-0000-0000-000000000000")] | length == 1' wrangler.jsonc > /dev/null \
            || { echo "::error::wrangler.jsonc must have exactly one DB binding with the placeholder database_id"; exit 1; }
          jq --arg id "$D1_DATABASE_ID" '(.d1_databases[] | select(.binding == "DB") | .database_id) = $id' wrangler.jsonc > wrangler.production.jsonc
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply meridian --remote --config wrangler.production.jsonc
      - name: Deploy
        run: npx wrangler deploy --config wrangler.production.jsonc
