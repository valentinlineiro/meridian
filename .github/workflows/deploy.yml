name: deploy

# Production deployment of the Worker. Two ways in:
#  - workflow_dispatch (Actions tab -> Run workflow on main): always allowed.
#  - push to main: inert until the repository variable CD_AUTO_DEPLOY is "true" (same switch pattern as the collector cron).
# Migrations are NEVER applied here: they are additive and applied by hand first. A pending one stops the deploy.
# Required repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID.
# Required repository variables: SYNC_REPO, SYNC_WORKFLOW, SYNC_REF (where Sync dispatches), PROD_URL (smoke test target).
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || vars.CD_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: python3 scripts/check_architecture_boundaries.py
      - run: npm test

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two runs in a row must not deploy at the same time; the second waits for the first.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      SYNC_REPO: ${{ vars.SYNC_REPO }}
      SYNC_WORKFLOW: ${{ vars.SYNC_WORKFLOW }}
      SYNC_REF: ${{ vars.SYNC_REF }}
      PROD_URL: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check credentials and smoke target
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID PROD_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is not set (Settings -> Secrets and variables -> Actions)."; exit 1; }
          done
          echo "::add-mask::$D1_DATABASE_ID"
      # The tracked wrangler.jsonc keeps a placeholder database id and is never deployed. This step refuses anything but the
      # real id and the Sync variables, and writes the git-ignored wrangler.production.jsonc used by every wrangler command below.
      - name: Generate the production wrangler config
        run: node --experimental-strip-types scripts/makeProductionConfig.ts
      - name: Refuse to deploy over pending migrations
        run: |
          for attempt in 1 2 3; do
            out=$(npx wrangler d1 migrations list meridian --remote --config wrangler.production.jsonc 2>&1) && break
            echo "attempt $attempt failed, retrying"; sleep 10
          done
          echo "$out" | tail -5
          echo "$out" | grep -q "No migrations to apply" \
            || { echo "::error::Pending or unreadable migrations. Apply them by hand (migrations apply) before deploying."; exit 1; }
      - name: Deploy
        run: npx wrangler deploy --config wrangler.production.jsonc
      - name: Smoke test
        run: |
          code() { curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$PROD_URL$1"; }
          [ "$(code /login)" = 200 ]          || { echo "::error::/login is not 200 after deploy"; exit 1; }
          [ "$(code /)" = 303 ]               || { echo "::error::/ is not 303 after deploy"; exit 1; }
          [ "$(code /api/stats/lang)" = 401 ] || { echo "::error::protected API is not closed after deploy"; exit 1; }
          echo "smoke ok; to go back: npx wrangler rollback <version-id>"
